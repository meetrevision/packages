copyright: MeetRevision
package: Revision-ReviOS-Telemetry-Removal
target_arch: amd64
version: 1.0.0.0
updates:
  # The system will not boot without utcapi and utcutil, so replace them with stubs.
  - target_component: Microsoft-Windows-Unified-Telemetry-Client
    target_arch: amd64
    version: 38655.38527.65535.65535
    files:
      - file: 'utcapi.dll'
        destination: '$(runtime.windows)\System32\'
        operation: replace
        stub:
          exports: [
            UtcClearTimerConfiguration, UtcCloseSessionHandle, UtcCreateSessionHandle,
            UtcDownloadLatestSettingsForNamespaceEx, UtcEscalateScenarioEx, UtcForceUpload,
            UtcGetActiveScenarioList2, UtcGetTimerConfiguration, UtcIsScenarioActive,
            UtcSetTelemetryOptIn, UtcTenantRegister, UtcTenantUnregister,
            UtcTenantUpdateDailyUploadQuota, UtcUpdateTimerConfiguration
          ]
      - file: 'utcutil.dll'
        destination: '$(runtime.windows)\System32\'
        operation: replace
        stub:
          exports: [ DiskCleanupEnd, DiskCleanupStart, GetCommonAttributes, GetPropertyAlloc ]
  - target_component: Microsoft-Windows-Unified-Telemetry-Client-WoWOnly
    target_arch: wow64
    version: 38655.38527.65535.65535

  # recovery.dll and SpeechUX\SpeechUX.dll statically import sqmapi.dll. Keep a stub so they continue to work.
  - target_component: Microsoft-Windows-SQMApi
    target_arch: amd64
    version: 38655.38527.65535.65535
    files:
      - file: 'sqmapi.dll'
        destination: '$(runtime.windows)\System32\'
        operation: replace
        stub:
          exports: [
            SqmAddToAverage, SqmAddToStream, SqmAddToStreamDWord,
            SqmAddToStreamDWord64, SqmAddToStreamString, SqmAddToStreamV,
            SqmCheckEscalationAddToStreamDWord, SqmCheckEscalationAddToStreamDWord64,
            SqmCheckEscalationAddToStreamString, SqmCheckEscalationSetDWord,
            SqmCheckEscalationSetDWord64, SqmCheckEscalationSetString,
            SqmCleanup, SqmClearFlags, SqmCreateNewId, SqmEndSession,
            SqmEndSessionEx, SqmFlushSession, SqmGetEnabled,
            SqmGetEscalationRuleStatus, SqmGetFlags, SqmGetInstrumentationProperty,
            SqmGetLastUploadTime, SqmGetMachineId, SqmGetSession,
            SqmGetSessionStartTime, SqmGetUserId, SqmIncrement,
            SqmIsNamespaceEnabled, SqmIsWindowsOptedIn, SqmLoadEscalationManifest,
            SqmReadSharedMachineId, SqmReadSharedUserId, SqmSet, SqmSetAppId,
            SqmSetAppVersion, SqmSetBits, SqmSetBool,
            SqmSetCurrentTimeAsUploadTime, SqmSetDWord64, SqmSetEnabled,
            SqmSetEscalationInfo, SqmSetFlags, SqmSetIfMax, SqmSetIfMin,
            SqmSetMachineId, SqmSetString, SqmSetUserId, SqmStartSession,
            SqmStartUpload, SqmStartUploadEx, SqmSysprepCleanup,
            SqmSysprepGeneralize, SqmTimerAccumulate, SqmTimerAddToAverage,
            SqmTimerRecord, SqmTimerStart, SqmUnattendedSetup,
            SqmUnloadEscalationManifest, SqmWaitForUploadComplete,
            SqmWriteSharedMachineId, SqmWriteSharedUserId
          ]
  - target_component: Microsoft-Windows-SQMApi
    target_arch: wow64
    version: 38655.38527.65535.65535
